<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Job Application Form</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f4f4f9;
            padding: 20px;
        }
        .form-container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2, h3 {
            margin-bottom: 10px;
            color: #333;
        }
        .section-title {
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 3px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-submit {
            background-color: #0056b3;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: #003d80;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Online Job Application Form</h2>
    <p><em>Scenario: Please fill in all fields correctly before submission.</em></p>

    <form id="jobApplicationForm" onsubmit="return validateForm()">
        
        <!-- Personal Information -->
        <div class="section-title">Personal Information</div>
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" required>
        </div>
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" required>
        </div>
        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" rows="2" required></textarea>
        </div>
        <div class="form-group">
            <label for="cityPincode">City / State / PIN Code</label>
            <input type="text" id="cityPincode" required>
        </div>

        <!-- Educational Qualification -->
        <div class="section-title">Educational Qualification</div>
        <div class="form-group">
            <label for="qualification">Highest Qualification</label>
            <input type="text" id="qualification" required>
        </div>
        <div class="form-group">
            <label for="university">University / Institute</label>
            <input type="text" id="university" required>
        </div>
        <div class="form-group">
            <label for="passingYear">Passing Year</label>
            <input type="number" id="passingYear" min="1950" max="2030" required>
        </div>
        <div class="form-group">
            <label for="cgpa">Percentage / CGPA</label>
            <input type="text" id="cgpa" required>
        </div>

        <!-- Professional Information -->
        <div class="section-title">Professional Information</div>
        <div class="form-group">
            <label for="jobPosition">Applying For / Job Position</label>
            <input type="text" id="jobPosition" required>
        </div>
        <div class="form-group">
            <label for="experience">Total Work Experience (Years)</label>
            <input type="number" id="experience" step="0.1" required>
        </div>
        <div class="form-group">
            <label for="prevOrg">Current / Previous Organization</label>
            <input type="text" id="prevOrg" required>
        </div>
        <div class="form-group">
            <label for="designation">Current Designation</label>
            <input type="text" id="designation" required>
        </div>
        <div class="form-group">
            <label for="salary">Expected Salary</label>
            <input type="number" id="salary" required>
        </div>

        <!-- Technical Skills -->
        <div class="section-title">Technical Skills</div>
        <div class="form-group">
            <label for="languages">Programming Languages</label>
            <input type="text" id="languages" placeholder="e.g., JavaScript, Python, C++" required>
        </div>
        <div class="form-group">
            <label for="techSkills">Technical Skills</label>
            <input type="text" id="techSkills" placeholder="e.g., HTML, CSS, React" required>
        </div>
        <div class="form-group">
            <label for="certifications">Certifications</label>
            <input type="text" id="certifications">
        </div>

        <button type="submit" class="btn-submit">Submit Application</button>
    </form>
</div>

<script>
    function validateForm() {
        const mobile = document.getElementById("mobile").value;
        const email = document.getElementById("email").value;

        // Basic Mobile Validation (10 Digits)
        const phonePattern = /^[0-9]{10}$/;
        if (!phonePattern.test(mobile)) {
            alert("Please enter a valid 10-digit mobile number.");
            return false;
        }

        // Basic Email Validation
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email)) {
            alert("Please enter a valid email address.");
            return false;
        }

        alert("Application submitted successfully!");
        return true;
    }
</script>

</body>
</html>
